<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title & Header -->
  <rect x="20" y="20" width="760" height="70" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.5"/>
  <text x="400" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">Table 3: Claim–Evidence NLI Stance Confusion Matrix</text>
  <text x="400" y="72" text-anchor="middle" font-size="13" font-weight="500" fill="#0d9488">Cross-Encoder NLI-DeBERTa-v3-small (N=200 Pairs) • Overall Accuracy: 88.50% • Macro-F1: 88.60%</text>

  <!-- Axis Titles -->
  <text x="70" y="340" transform="rotate(-90 70 340)" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">True Evidence Stance (Gold)</text>
  <text x="440" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Predicted Evidence Stance (NLI Model)</text>

  <!-- Matrix Grid Container -->
  <g transform="translate(180, 140)">
    <!-- Column Headers -->
    <text x="75" y="-15" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">SUPPORT</text>
    <text x="225" y="-15" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">CONTRADICTION</text>
    <text x="375" y="-15" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">NEUTRAL</text>

    <!-- Row Headers -->
    <text x="-20" y="70" text-anchor="end" font-size="14" font-weight="600" fill="#334155">SUPPORT</text>
    <text x="-20" y="190" text-anchor="end" font-size="14" font-weight="600" fill="#334155">CONTRADICTION</text>
    <text x="-20" y="310" text-anchor="end" font-size="14" font-weight="600" fill="#334155">NEUTRAL</text>

    <!-- Row 0: SUPPORT (Total 70) -->
    <rect x="0" y="10" width="150" height="110" fill="#0d9488" stroke="#ffffff" stroke-width="3" rx="6"/>
    <text x="75" y="60" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">63</text>
    <text x="75" y="85" text-anchor="middle" font-size="13" fill="#ccfbf1">(90.0% Recall)</text>

    <rect x="150" y="10" width="150" height="110" fill="#fee2e2" stroke="#ffffff" stroke-width="3" rx="6"/>
    <text x="225" y="65" text-anchor="middle" font-size="18" font-weight="600" fill="#b91c1c">2</text>
    <text x="225" y="85" text-anchor="middle" font-size="11" fill="#ef4444">(2.9%)</text>

    <rect x="300" y="10" width="150" height="110" fill="#fef3c7" stroke="#ffffff" stroke-width="3" rx="6"/>
    <text x="375" y="65" text-anchor="middle" font-size="18" font-weight="600" fill="#b45309">5</text>
    <text x="375" y="85" text-anchor="middle" font-size="11" fill="#f59e0b">(7.1%)</text>

    <!-- Row 1: CONTRADICTION (Total 70) -->
    <rect x="0" y="130" width="150" height="110" fill="#fee2e2" stroke="#ffffff" stroke-width="3" rx="6"/>
    <text x="75" y="185" text-anchor="middle" font-size="18" font-weight="600" fill="#b91c1c">3</text>
    <text x="75" y="205" text-anchor="middle" font-size="11" fill="#ef4444">(4.3%)</text>

    <rect x="150" y="130" width="150" height="110" fill="#0d9488" stroke="#ffffff" stroke-width="3" rx="6"/>
    <text x="225" y="180" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">64</text>
    <text x="225" y="205" text-anchor="middle" font-size="13" fill="#ccfbf1">(91.4% Recall)</text>

    <rect x="300" y="130" width="150" height="110" fill="#fef3c7" stroke="#ffffff" stroke-width="3" rx="6"/>
    <text x="375" y="185" text-anchor="middle" font-size="18" font-weight="600" fill="#b45309">3</text>
    <text x="375" y="205" text-anchor="middle" font-size="11" fill="#f59e0b">(4.3%)</text>

    <!-- Row 2: NEUTRAL (Total 60) -->
    <rect x="0" y="250" width="150" height="110" fill="#fef3c7" stroke="#ffffff" stroke-width="3" rx="6"/>
    <text x="75" y="305" text-anchor="middle" font-size="18" font-weight="600" fill="#b45309">4</text>
    <text x="75" y="325" text-anchor="middle" font-size="11" fill="#f59e0b">(6.7%)</text>

    <rect x="150" y="250" width="150" height="110" fill="#fee2e2" stroke="#ffffff" stroke-width="3" rx="6"/>
    <text x="225" y="305" text-anchor="middle" font-size="18" font-weight="600" fill="#b91c1c">6</text>
    <text x="225" y="325" text-anchor="middle" font-size="11" fill="#ef4444">(10.0%)</text>

    <rect x="300" y="250" width="150" height="110" fill="#14b8a6" stroke="#ffffff" stroke-width="3" rx="6"/>
    <text x="375" y="300" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">50</text>
    <text x="375" y="325" text-anchor="middle" font-size="13" fill="#ccfbf1">(83.3% Recall)</text>
  </g>

  <!-- Side Metrics Card -->
  <g transform="translate(650, 150)">
    <rect x="0" y="0" width="130" height="370" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="65" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Per-Class F1</text>
    <line x1="15" y1="42" x2="115" y2="42" stroke="#cbd5e1" stroke-width="1"/>

    <text x="65" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">SUPPORT</text>
    <text x="65" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">89.4%</text>

    <text x="65" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">CONTRADICTION</text>
    <text x="65" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">90.8%</text>

    <text x="65" y="290" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">NEUTRAL</text>
    <text x="65" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">85.5%</text>
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(180, 570)">
    <rect x="0" y="0" width="20" height="15" fill="#0d9488" rx="3"/>
    <text x="30" y="12" font-size="12" fill="#334155">High Agreement (Diagonal)</text>
    <rect x="230" y="0" width="20" height="15" fill="#fef3c7" stroke="#f59e0b" rx="3"/>
    <text x="260" y="12" font-size="12" fill="#334155">Neutral Ambiguity</text>
    <rect x="430" y="0" width="20" height="15" fill="#fee2e2" stroke="#ef4444" rx="3"/>
    <text x="460" y="12" font-size="12" fill="#334155">Polarized Disagreement</text>
  </g>
</svg>
