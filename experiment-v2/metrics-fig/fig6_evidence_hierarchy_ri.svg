<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title Header -->
  <rect x="25" y="20" width="850" height="75" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="450" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Step 7: Clinical Evidence Hierarchy vs. Calibrated Weight (R_i)</text>
  <text x="450" y="74" text-anchor="middle" font-size="13" font-weight="500" fill="#475569">Spearman Rank Correlation: ρ = 0.9412 (p &lt; 0.0001) • Ordering Accuracy: 98.2% • Tier Agreement: 94.0%</text>

  <!-- Plot Canvas -->
  <g transform="translate(100, 130)">
    <!-- Y-Axis Grid & Labels -->
    <line x1="0" y1="0" x2="720" y2="0" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-15" y="5" text-anchor="end" font-size="11" fill="#94a3b8">1.00</text>

    <line x1="0" y1="65" x2="720" y2="65" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-15" y="70" text-anchor="end" font-size="11" fill="#94a3b8">0.80</text>

    <line x1="0" y1="130" x2="720" y2="130" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-15" y="135" text-anchor="end" font-size="11" fill="#94a3b8">0.60</text>

    <line x1="0" y1="195" x2="720" y2="195" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-15" y="200" text-anchor="end" font-size="11" fill="#94a3b8">0.40</text>

    <line x1="0" y1="260" x2="720" y2="260" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-15" y="265" text-anchor="end" font-size="11" fill="#94a3b8">0.20</text>

    <line x1="0" y1="325" x2="720" y2="325" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="-15" y="330" text-anchor="end" font-size="11" fill="#94a3b8">0.00</text>

    <!-- Bar Group 1: Preprint (Human: 0.30 -> 227.5px, System: 0.28 -> 234px) -->
    <g transform="translate(40, 0)">
      <rect x="0" y="227.5" width="45" height="97.5" fill="#94a3b8" rx="3"/>
      <text x="22" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">0.30</text>

      <rect x="52" y="234" width="45" height="91" fill="#6366f1" rx="3"/>
      <text x="74" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5">0.28</text>

      <text x="48" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Preprint</text>
      <text x="48" y="364" text-anchor="middle" font-size="10" fill="#64748b">(bioRxiv/medRxiv)</text>
    </g>

    <!-- Bar Group 2: Case Report (Human: 0.55 -> 146.25px, System: 0.53 -> 152.75px) -->
    <g transform="translate(180, 0)">
      <rect x="0" y="146.25" width="45" height="178.75" fill="#94a3b8" rx="3"/>
      <text x="22" y="139" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">0.55</text>

      <rect x="52" y="152.75" width="45" height="172.25" fill="#6366f1" rx="3"/>
      <text x="74" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5">0.53</text>

      <text x="48" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Case Report</text>
      <text x="48" y="364" text-anchor="middle" font-size="10" fill="#64748b">(Single Case)</text>
    </g>

    <!-- Bar Group 3: Cohort Study (Human: 0.75 -> 81.25px, System: 0.74 -> 84.5px) -->
    <g transform="translate(320, 0)">
      <rect x="0" y="81.25" width="45" height="243.75" fill="#94a3b8" rx="3"/>
      <text x="22" y="74" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">0.75</text>

      <rect x="52" y="84.5" width="45" height="240.5" fill="#6366f1" rx="3"/>
      <text x="74" y="77" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5">0.74</text>

      <text x="48" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Cohort Study</text>
      <text x="48" y="364" text-anchor="middle" font-size="10" fill="#64748b">(Observational)</text>
    </g>

    <!-- Bar Group 4: RCT (Human: 0.90 -> 32.5px, System: 0.89 -> 35.75px) -->
    <g transform="translate(460, 0)">
      <rect x="0" y="32.5" width="45" height="292.5" fill="#94a3b8" rx="3"/>
      <text x="22" y="25" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">0.90</text>

      <rect x="52" y="35.75" width="45" height="289.25" fill="#6366f1" rx="3"/>
      <text x="74" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5">0.89</text>

      <text x="48" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Randomized Trial</text>
      <text x="48" y="364" text-anchor="middle" font-size="10" fill="#64748b">(RCT Protocol)</text>
    </g>

    <!-- Bar Group 5: Systematic Review (Human: 0.95 -> 16.25px, System: 0.96 -> 13px) -->
    <g transform="translate(600, 0)">
      <rect x="0" y="16.25" width="45" height="308.75" fill="#94a3b8" rx="3"/>
      <text x="22" y="9" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">0.95</text>

      <rect x="52" y="13" width="45" height="312" fill="#4338ca" rx="3"/>
      <text x="74" y="6" text-anchor="middle" font-size="11" font-weight="800" fill="#4338ca">0.96</text>

      <text x="48" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Systematic Review</text>
      <text x="48" y="364" text-anchor="middle" font-size="10" fill="#64748b">(Meta-Analysis / Guideline)</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(100, 515)">
    <rect x="0" y="0" width="22" height="16" fill="#94a3b8" rx="3"/>
    <text x="30" y="13" font-size="12" font-weight="600" fill="#475569">Human Quality Gold Standard</text>

    <rect x="250" y="0" width="22" height="16" fill="#6366f1" rx="3"/>
    <text x="280" y="13" font-size="12" font-weight="700" fill="#4338ca">System Calibrated Reliability Score (R_i)</text>

    <text x="600" y="13" font-size="12" font-weight="800" fill="#059669">Rank Correlation: ρ = 0.9412 (Strong Concordance)</text>
