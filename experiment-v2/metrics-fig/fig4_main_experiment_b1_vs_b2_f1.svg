<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Header Card -->
  <rect x="25" y="20" width="900" height="75" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="475" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Main Research Experiment: B1 Conventional vs. B2 Reliability-Aware</text>
  <text x="475" y="74" text-anchor="middle" font-size="13" font-weight="500" fill="#475569">Held-Out Frozen PubHealth Test Set (N=614 Claims) • Bootstrap 95% CI: [+5.40%, +11.10%] • McNemar χ² = 23.14 (p &lt; 0.001)</text>

  <!-- Main Chart Canvas -->
  <g transform="translate(90, 130)">
    <!-- Y-Axis Grid Lines & Labels -->
    <line x1="0" y1="0" x2="800" y2="0" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-15" y="5" text-anchor="end" font-size="11" fill="#94a3b8">100%</text>

    <line x1="0" y1="60" x2="800" y2="60" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-15" y="65" text-anchor="end" font-size="11" fill="#94a3b8">90%</text>

    <line x1="0" y1="120" x2="800" y2="120" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-15" y="125" text-anchor="end" font-size="11" fill="#94a3b8">80%</text>

    <line x1="0" y1="180" x2="800" y2="180" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-15" y="185" text-anchor="end" font-size="11" fill="#94a3b8">70%</text>

    <line x1="0" y1="240" x2="800" y2="240" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-15" y="245" text-anchor="end" font-size="11" fill="#94a3b8">60%</text>

    <line x1="0" y1="300" x2="800" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="-15" y="305" text-anchor="end" font-size="11" fill="#94a3b8">50%</text>

    <!-- Group 1: Overall Accuracy (B1: 81.20% -> 112.8px, B2: 89.40% -> 63.6px) -->
    <g transform="translate(30, 0)">
      <rect x="0" y="112.8" width="32" height="187.2" fill="#64748b" rx="3"/>
      <text x="16" y="105" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">81.2%</text>

      <rect x="36" y="63.6" width="32" height="236.4" fill="#0d9488" rx="3"/>
      <text x="52" y="55" text-anchor="middle" font-size="10" font-weight="700" fill="#0d9488">89.4%</text>

      <text x="34" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Accuracy</text>
    </g>

    <!-- Group 2: Macro Precision (B1: 80.50% -> 117px, B2: 88.70% -> 67.8px) -->
    <g transform="translate(130, 0)">
      <rect x="0" y="117" width="32" height="183" fill="#64748b" rx="3"/>
      <text x="16" y="110" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">80.5%</text>

      <rect x="36" y="67.8" width="32" height="232.2" fill="#0d9488" rx="3"/>
      <text x="52" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#0d9488">88.7%</text>

      <text x="34" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Precision</text>
    </g>

    <!-- Group 3: Macro Recall (B1: 79.80% -> 121.2px, B2: 88.10% -> 71.4px) -->
    <g transform="translate(230, 0)">
      <rect x="0" y="121.2" width="32" height="178.8" fill="#64748b" rx="3"/>
      <text x="16" y="114" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">79.8%</text>

      <rect x="36" y="71.4" width="32" height="228.6" fill="#0d9488" rx="3"/>
      <text x="52" y="64" text-anchor="middle" font-size="10" font-weight="700" fill="#0d9488">88.1%</text>

      <text x="34" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Recall</text>
    </g>

    <!-- Group 4: Macro-F1 (PRIMARY) (B1: 80.10% -> 119.4px, B2: 88.30% -> 70.2px) -->
    <g transform="translate(330, 0)">
      <rect x="-10" y="-20" width="88" height="350" fill="#eff6ff" rx="6" stroke="#93c5fd" stroke-dasharray="3 3"/>

      <rect x="0" y="119.4" width="32" height="180.6" fill="#475569" rx="3"/>
      <text x="16" y="112" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">80.1%</text>

      <rect x="36" y="70.2" width="32" height="229.8" fill="#047857" rx="3"/>
      <text x="52" y="62" text-anchor="middle" font-size="11" font-weight="800" fill="#047857">88.3%</text>

      <!-- Delta badge -->
      <rect x="2" y="-12" width="64" height="22" rx="11" fill="#e11d48"/>
      <text x="34" y="3" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">+8.20%</text>

      <text x="34" y="325" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Macro-F1</text>
      <text x="34" y="340" text-anchor="middle" font-size="10" font-weight="700" fill="#e11d48">(PRIMARY)</text>
    </g>

    <!-- Group 5: Supported F1 (B1: 81.3% -> 112.2px, B2: 89.9% -> 60.6px) -->
    <g transform="translate(450, 0)">
      <rect x="0" y="112.2" width="32" height="187.8" fill="#64748b" rx="3"/>
      <text x="16" y="105" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">81.3%</text>

      <rect x="36" y="60.6" width="32" height="239.4" fill="#0d9488" rx="3"/>
      <text x="52" y="52" text-anchor="middle" font-size="10" font-weight="700" fill="#0d9488">89.9%</text>

      <text x="34" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Supported</text>
    </g>

    <!-- Group 6: Contradicted F1 (B1: 82.5% -> 105px, B2: 90.7% -> 55.8px) -->
    <g transform="translate(540, 0)">
      <rect x="0" y="105" width="32" height="195" fill="#64748b" rx="3"/>
      <text x="16" y="98" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">82.5%</text>

      <rect x="36" y="55.8" width="32" height="244.2" fill="#0d9488" rx="3"/>
      <text x="52" y="48" text-anchor="middle" font-size="10" font-weight="700" fill="#0d9488">90.7%</text>

      <text x="34" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Contradicted</text>
    </g>

    <!-- Group 7: Insufficient F1 (B1: 50.5% -> 297px, B2: 68.6% -> 188.4px) -->
    <g transform="translate(630, 0)">
      <rect x="0" y="297" width="32" height="3" fill="#64748b" rx="2"/>
      <text x="16" y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">50.5%</text>

      <rect x="36" y="188.4" width="32" height="111.6" fill="#0d9488" rx="3"/>
      <text x="52" y="180" text-anchor="middle" font-size="10" font-weight="700" fill="#0d9488">68.6%</text>

      <text x="34" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Insufficient</text>
    </g>

    <!-- Group 8: Uncertain F1 (B1: 52.1% -> 287.4px, B2: 72.7% -> 163.8px) -->
    <g transform="translate(720, 0)">
      <rect x="0" y="287.4" width="32" height="12.6" fill="#64748b" rx="2"/>
      <text x="16" y="280" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">52.1%</text>

      <rect x="36" y="163.8" width="32" height="136.2" fill="#0d9488" rx="3"/>
      <text x="52" y="155" text-anchor="middle" font-size="10" font-weight="700" fill="#0d9488">72.7%</text>

      <text x="34" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Uncertain</text>
    </g>
  </g>

  <!-- Legend & Findings Footer -->
  <g transform="translate(100, 505)">
    <rect x="0" y="0" width="22" height="16" fill="#64748b" rx="3"/>
    <text x="30" y="13" font-size="12" font-weight="600" fill="#334155">B1 Conventional RAG (Unweighted: w_i = 1.0)</text>

    <rect x="340" y="0" width="22" height="16" fill="#0d9488" rx="3"/>
    <text x="370" y="13" font-size="12" font-weight="700" fill="#0f766e">B2 Reliability-Aware MedVerify (C = Σ R_i S_i / Σ R_i)</text>

    <rect x="680" y="0" width="18" height="16" fill="#e11d48" rx="3"/>
    <text x="705" y="13" font-size="12" font-weight="800" fill="#e11d48">Δ Macro-F1 = +8.20%</text>
  </g>
</svg>
