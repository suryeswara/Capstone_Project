<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title Header -->
  <rect x="25" y="20" width="850" height="75" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="450" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Table 6: Cross-Dataset External Generalization Performance</text>
  <text x="450" y="74" text-anchor="middle" font-size="13" font-weight="500" fill="#475569">Comparing Held-Out PubHealth Benchmark vs. CoAID Misinformation Corpus vs. Real-World Online Claims</text>

  <!-- Plot Canvas -->
  <g transform="translate(100, 130)">
    <!-- Y-Axis Grid & Labels (Range 70% to 100%) -->
    <line x1="0" y1="0" x2="700" y2="0" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-15" y="5" text-anchor="end" font-size="11" fill="#94a3b8">100%</text>

    <line x1="0" y1="50" x2="700" y2="50" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-15" y="55" text-anchor="end" font-size="11" fill="#94a3b8">95%</text>

    <line x1="0" y1="100" x2="700" y2="100" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-15" y="105" text-anchor="end" font-size="11" fill="#94a3b8">90%</text>

    <line x1="0" y1="150" x2="700" y2="150" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-15" y="155" text-anchor="end" font-size="11" fill="#94a3b8">85%</text>

    <line x1="0" y1="200" x2="700" y2="200" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-15" y="205" text-anchor="end" font-size="11" fill="#94a3b8">80%</text>

    <line x1="0" y1="250" x2="700" y2="250" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-15" y="255" text-anchor="end" font-size="11" fill="#94a3b8">75%</text>

    <line x1="0" y1="300" x2="700" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="-15" y="305" text-anchor="end" font-size="11" fill="#94a3b8">70%</text>

    <!-- Group 1: PubHealth Test Set (Acc: 89.4% -> 106px, F1: 88.3% -> 117px) -->
    <g transform="translate(45, 0)">
      <rect x="0" y="106" width="45" height="194" fill="#1e3a8a" rx="3"/>
      <text x="22" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">89.4%</text>

      <rect x="52" y="117" width="45" height="183" fill="#0d9488" rx="3"/>
      <text x="74" y="109" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">88.3%</text>

      <text x="48" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">PubHealth</text>
      <text x="48" y="340" text-anchor="middle" font-size="10" fill="#64748b">(Test Split N=614)</text>
    </g>

    <!-- Group 2: CoAID Overall (Acc: 91.5% -> 85px, F1: 90.8% -> 92px) -->
    <g transform="translate(215, 0)">
      <rect x="0" y="85" width="45" height="215" fill="#1e3a8a" rx="3"/>
      <text x="22" y="77" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">91.5%</text>

      <rect x="52" y="92" width="45" height="208" fill="#0d9488" rx="3"/>
      <text x="74" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">90.8%</text>

      <text x="48" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">CoAID</text>
      <text x="48" y="340" text-anchor="middle" font-size="10" fill="#64748b">(Misinformation)</text>
    </g>

    <!-- Group 3: CoAID Vaccination Subset (Acc: 92.5% -> 75px, F1: 91.9% -> 81px) -->
    <g transform="translate(385, 0)">
      <rect x="0" y="75" width="45" height="225" fill="#1e3a8a" rx="3"/>
      <text x="22" y="67" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">92.5%</text>

      <rect x="52" y="81" width="45" height="219" fill="#0d9488" rx="3"/>
      <text x="74" y="73" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">91.9%</text>

      <text x="48" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">CoAID Vaccine</text>
      <text x="48" y="340" text-anchor="middle" font-size="10" fill="#64748b">(Targeted Subset)</text>
    </g>

    <!-- Group 4: Real-World Claims (Acc: 86.7% -> 133px, F1: 84.8% -> 152px) -->
    <g transform="translate(555, 0)">
      <rect x="0" y="133" width="45" height="167" fill="#1e3a8a" rx="3"/>
      <text x="22" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">86.7%</text>

      <rect x="52" y="152" width="45" height="148" fill="#0d9488" rx="3"/>
      <text x="74" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">84.8%</text>

      <text x="48" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Real-World</text>
      <text x="48" y="340" text-anchor="middle" font-size="10" fill="#64748b">(Social Media N=120)</text>
    </g>
  </g>

  <!-- Legend & Interpretation Panel -->
  <g transform="translate(100, 485)">
    <rect x="0" y="0" width="22" height="16" fill="#1e3a8a" rx="3"/>
    <text x="30" y="13" font-size="12" font-weight="600" fill="#334155">Classification Accuracy</text>

    <rect x="220" y="0" width="22" height="16" fill="#0d9488" rx="3"/>
    <text x="250" y="13" font-size="12" font-weight="700" fill="#0f766e">Macro-F1 Score</text>

    <text x="450" y="13" font-size="12" font-weight="600" fill="#b91c1c">Generalization Gap to Real-World: -3.50% Macro-F1 (Robust Generalization)</text>
  </g>
</svg>
