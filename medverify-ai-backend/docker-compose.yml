version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medverify_postgres
    restart: always
    environment:
      POSTGRES_USER: medverify
      POSTGRES_PASSWORD: medverify_secret
      POSTGRES_DB: medverify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medverify -d medverify_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medverify_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=medverify
      - POSTGRES_PASSWORD=medverify_secret
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=medverify_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
